<title>Конкурентный срез BAZA</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
/* Страница входа: содержимое сайта зашифровано (AES-256-GCM, ключ из пароля через PBKDF2-SHA256)
   и расшифровывается в браузере только после ввода пароля. Палитра — как на основном сайте. */
:root {
  color-scheme: light;
  --bg: #F5F8FB; --surface: #FFFFFF; --ink: #002346; --ink-2: #3E5C7C; --muted: #6C8DAF;
  --line: #D8E6F4; --own: #E20617; --own-hover: #B50C20;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px;
}
.card {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 20px;
  padding: 32px 28px 28px; box-shadow: 0 8px 32px rgba(0, 35, 70, .08);
}
.mark { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--own); display: block; }
.mark span { font: 600 13px/1 Unbounded, Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
h1 { font: 600 22px/1.25 Unbounded, Inter, sans-serif; margin: 0 0 6px; }
p.sub { margin: 0 0 22px; color: var(--ink-2); }
label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input[type=password] {
  width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px;
  font: inherit; color: var(--ink); background: #fff; outline: none;
}
input[type=password]:focus { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(62, 92, 124, .12); }
.row { display: flex; align-items: center; gap: 8px; margin: 14px 0 20px; font-size: 14px; color: var(--ink-2); }
.row input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
button {
  width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--own); color: #fff;
  font: 600 15px/1 Inter, sans-serif; cursor: pointer;
}
button:hover { background: var(--own-hover); }
button:disabled { opacity: .6; cursor: progress; }
.err { min-height: 20px; margin: 12px 0 0; font-size: 14px; color: var(--own); }
noscript { display: block; margin-top: 12px; color: var(--own); }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="mark"><i></i><span>BAZA</span></div>
  <h1>Конкурентный срез</h1>
  <p class="sub">Доступ по паролю</p>
  <input type="text" name="username" value="konkurentny-srez" autocomplete="username" hidden>
  <label class="f" for="pw">Пароль</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="row"><input type="checkbox" id="remember" checked> Запомнить на этом устройстве</label>
  <button type="submit" id="go">Открыть</button>
  <p class="err" id="err" role="alert"></p>
  <noscript>Для входа нужен включённый JavaScript.</noscript>
</form>

const KEY = "ks-site-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = a => btoa(String.fromCharCode(...a));
const store = {
  get(s, k) { try { return s.getItem(k); } catch (e) { return null; } },
  set(s, k, v) { try { s.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256));
}

async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function tryStored() {
  if (new URLSearchParams(location.search).has("logout")) { store.del(KEY); return; }
  const saved = store.get(sessionStorage, KEY) || store.get(localStorage, KEY);
  if (!saved) return;
  try { show(await decrypt(b64(saved))); } catch (e) { store.del(KEY); }
}

const f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err");
f.addEventListener("submit", async ev => {
  ev.preventDefault();
  err.textContent = "";
  go.disabled = true; go.textContent = "Проверяю…";
  try {
    const raw = await derive(pw.value);
    let html;
    try { html = await decrypt(raw); } catch (e) { throw new Error("bad"); }
    const k = tob64(raw);
    store.set(sessionStorage, KEY, k);
    if (document.getElementById("remember").checked) store.set(localStorage, KEY, k);
    show(html);
  } catch (e) {
    err.textContent = e.message === "bad" ? "Неверный пароль" : "Браузер не поддерживает расшифровку. Откройте сайт в свежей версии Chrome, Edge, Safari или Firefox.";
    go.disabled = false; go.textContent = "Открыть";
    pw.select();
  }
});
tryStored();
})();
